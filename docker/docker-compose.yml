services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: esports_go_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - FRONTEND_URL=http://localhost:3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-esports_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-esports_dev_password_change_in_prod}
      - DB_NAME=${POSTGRES_DB:-esports_db}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-esports_redis_dev_password}
      - REDIS_DB=0
      - JWT_SECRET=super_secret_jwt_key_change_in_production_min_32_chars
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=esports-assets
      - S3_USE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: esports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esports_db}
      POSTGRES_USER: ${POSTGRES_USER:-esports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esports_dev_password_change_in_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esports_user} -d ${POSTGRES_DB:-esports_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["optional"]
    image: redis:7-alpine
    container_name: esports_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-esports_redis_dev_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: esports_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
